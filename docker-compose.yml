# Local development database. The API and web app run on the host (see README).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fogline
      POSTGRES_PASSWORD: fogline
      POSTGRES_DB: fogline
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fogline -d fogline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
